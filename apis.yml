aid: cycle
name: Cycle
description: >-
  CYCLE (operated by CM Invest B.V., Amsterdam) is a European electric-mobility
  subscription service that provides e-bikes and cargo bikes to professional
  delivery riders, couriers, and businesses. Its all-inclusive monthly
  subscriptions bundle maintenance, on-site repairs, bike swaps, GPS tracking,
  theft protection, and remote motor control across 100+ cities in Germany,
  Austria, the Netherlands, Belgium, Poland, Italy, and the UK. CYCLE was added
  to the API Evangelist network as a company profile; the provider publishes a
  consumer/business marketing and operations site but exposes no public
  developer API, SDKs, or developer portal at this time.
